name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yola-web (Astro)
        uses: actions/checkout@v4
        with:
          path: yola-web

      - name: Checkout si-yola (UI SolidJS)
        uses: actions/checkout@v4
        with:
          repository: NO-OPEN-YOLA/si-yola
          token: ${{ secrets.YOLA_GITHUB_TOKEN }}
          path: si-yola

      # si-yola depende de @yola/client via file:../yola-client-ts —
      # el SDK debe quedar en el mismo layout que localmente.
      - name: Checkout yola-client-ts (SDK local)
        uses: actions/checkout@v4
        with:
          repository: NO-OPEN-YOLA/yola-client-ts
          token: ${{ secrets.YOLA_GITHUB_TOKEN }}
          path: yola-client-ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias si-yola
        working-directory: si-yola
        run: bun install

      # @yola/client (file:../yola-client-ts) apunta a dist/ que está en
      # .gitignore — hay que buildearlo (tsup) antes del build de si-yola.
      - name: Build yola-client-ts (SDK -> dist/)
        working-directory: yola-client-ts
        run: |
          bun install
          bun run build

      - name: Build UI (vite build -> dist/)
        working-directory: si-yola
        run: bun run build

      # El OS se sirve bajo /yola-os/ dentro del build de Astro.
      # Recrear el directorio evita assets viejos con hash.
      - name: Copiar dist si-yola a public/yola-os
        run: |
          rm -rf yola-web/public/yola-os
          mkdir -p yola-web/public/yola-os
          cp -r si-yola/dist/* yola-web/public/yola-os/

      # Astro: public/ (estáticos + yola-os/) → dist/ (páginas generadas).
      - name: Instalar dependencias Astro
        working-directory: yola-web
        run: npm install --no-audit --no-fund

      - name: Build Astro -> dist/
        working-directory: yola-web
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: yola-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
